name: Update buybacks data

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to overlap before the latest committed disclosure date.
        required: false
        default: "7"
      price_lookback_days:
        description: Recent event window for refreshing incomplete price reactions.
        required: false
        default: "75"
      price_reaction_scope:
        description: "Price reaction recalculation scope: recent (daily default), missing-series (backfill events without a daily return series), all (full recalculation)."
        required: false
        default: "recent"
      build_timeout_minutes:
        description: Build step timeout in minutes. Raise for missing-series/all recalculations over large backfills.
        required: false
        default: "25"
      allow_shrink:
        description: "Set to true to let validation pass when events/holdings/executions drop by more than 2% (intentional cleanup only)."
        required: false
        default: "false"
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: buybacks-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
      PRICE_LOOKBACK_DAYS: ${{ github.event.inputs.price_lookback_days || '75' }}
      PRICE_REACTION_SCOPE: ${{ github.event.inputs.price_reaction_scope || 'recent' }}
      BUYBACKS_ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Check out the branch head at job start, not the SHA pinned at
          # dispatch time: queued data runs otherwise base on a stale commit
          # and the final rebase-push conflicts with the previous run's data.
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test tools
        run: python -m pip install --upgrade pip pytest

      # Row-count baseline for the validator's shrink guard (the committed dataset).
      - name: Snapshot committed dataset
        run: cp -R public/data/buybacks "$RUNNER_TEMP/buybacks-baseline"

      - name: Incrementally update buybacks data
        timeout-minutes: ${{ fromJSON(github.event.inputs.build_timeout_minutes || '25') }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_RETRIES: "3"
          DART_TIMEOUT_SECONDS: "30"
          KIS_PROXY_URL: ${{ secrets.KIS_PROXY_URL }}
          KIS_PROXY_TOKEN: ${{ secrets.KIS_PROXY_TOKEN }}
        run: >
          python scripts/buybacks/build_buybacks_dataset.py
          --live-if-available
          --incremental
          --output public/data/buybacks
          --stock-codes ALL
          --holding-stock-codes EVENTS
          --holding-source stock_totals
          --listed-issue-source naver
          --report-codes 11011
          --max-companies 0
          --max-holding-companies 0
          --discovery-page-limit 50
          --incremental-lookback-days "$LOOKBACK_DAYS"
          --incremental-price-lookback-days "$PRICE_LOOKBACK_DAYS"
          --price-reaction-scope "$PRICE_REACTION_SCOPE"

      - name: Preserve diagnostic dataset without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buybacks-diagnostic-${{ github.run_id }}
          path: |
            public/data/buybacks
            data/raw/buybacks/listed_issues_naver.json
          retention-days: 7
